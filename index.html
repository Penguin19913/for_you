<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,500&family=Cormorant+Garamond:wght@700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0a0d; --bg2:#16121a; --card:#1c1620;
    --gold:#cda23e; --gold-soft:#e6c778; --wine:#7a2035;
    --text:#f1e9df; --text-dim:#b9aea3;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px); height:100%;}
  body{
    margin:0; min-height:100%; background:
      radial-gradient(ellipse at 50% -10%, #241a26 0%, var(--bg) 55%);
    color:var(--text); font-family:'Cormorant Garamond', Georgia, serif;
    display:flex; flex-direction:column; align-items:center; padding:2.5rem 1.2rem 3.5rem;
  }
  .counter{
    font-size:0.95rem; letter-spacing:.04em; color:var(--gold-soft);
    border:1px solid rgba(205,162,62,.35); border-radius:999px;
    padding:.45rem 1.1rem; margin-bottom:1.8rem; background:rgba(205,162,62,.06);
  }
  h1{
    font-size:clamp(2.1rem,6vw,3.3rem); font-weight:700; margin:0 0 .3rem;
    color:var(--gold-soft); text-align:center; line-height:1.1;
  }
  .sub{ color:var(--text-dim); font-size:1.15rem; text-align:center; margin:0 0 2.4rem; max-width:36ch; font-style:italic; }
  nav{ display:flex; gap:.6rem; margin-bottom:2.2rem; flex-wrap:wrap; justify-content:center; }
  nav button{
    font-family:inherit; font-size:1.02rem; color:var(--text);
    background:var(--card); border:1px solid rgba(205,162,62,.25);
    padding:.55rem 1.3rem; border-radius:8px; cursor:pointer; transition:border-color .2s, color .2s;
  }
  nav button.active, nav button:hover{ color:var(--gold-soft); border-color:var(--gold); }
  .panel{ width:100%; max-width:520px; display:none; }
  .panel.active{ display:block; }
  .card{
    background:linear-gradient(180deg, var(--card), var(--bg2));
    border:1px solid rgba(205,162,62,.18); border-radius:16px;
    padding:1.8rem; box-shadow:0 20px 50px -25px rgba(0,0,0,.7);
  }
  .card h2{ margin-top:0; color:var(--gold-soft); font-weight:700; font-size:1.6rem; }
  /* memory game */
  .grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:.6rem; margin-top:1rem; }
  .tile{
    aspect-ratio:1; border-radius:10px; background:var(--bg2);
    border:1px solid rgba(205,162,62,.25); display:flex; align-items:center; justify-content:center;
    font-size:1.7rem; cursor:pointer; user-select:none; transition:transform .15s, background .2s;
  }
  .tile.flip{ background:var(--wine); transform:scale(1.03); }
  .tile.matched{ background:rgba(205,162,62,.18); border-color:var(--gold); cursor:default; }
  .status{ margin-top:1rem; text-align:center; color:var(--text-dim); font-size:1.05rem; }
  /* catch game */
  .catchWrap{ position:relative; width:100%; height:340px; background:var(--bg2); border-radius:12px; overflow:hidden; border:1px solid rgba(205,162,62,.2); margin-top:1rem; touch-action:none; }
  .heart{ position:absolute; font-size:1.6rem; top:-30px; user-select:none; }
  .basket{ position:absolute; bottom:8px; width:64px; height:34px; font-size:2rem; text-align:center; }
  .scoreRow{ display:flex; justify-content:space-between; margin-top:.7rem; color:var(--text-dim); font-size:1.05rem; }
  .btn{
    font-family:inherit; margin-top:1.1rem; width:100%; padding:.65rem;
    background:var(--wine); color:var(--gold-soft); border:1px solid var(--gold);
    border-radius:8px; font-size:1.05rem; cursor:pointer;
  }
  .btn:hover{ background:#8f2740; }
  footer{ margin-top:2.5rem; color:var(--text-dim); font-size:.9rem; text-align:center; opacity:.7; }
  @media (max-width:420px){ .grid{grid-template-columns:repeat(4,1fr); gap:.45rem;} .tile{font-size:1.4rem;} }
</style>
</head>
<body>
  <div class="counter" id="counterText">Loading...</div>
  <h1>For the one who has my heart</h1>
  <p class="sub">A little corner of the internet, just for you.</p>

  <nav>
    <button data-panel="memory" class="active">Memory Game</button>
    <button data-panel="catch">Catch the Hearts</button>
  </nav>

  <div class="panel active" id="memory">
    <div class="card">
      <h2>Match the hearts</h2>
      <div class="grid" id="memGrid"></div>
      <div class="status" id="memStatus">Find all the pairs.</div>
      <button class="btn" id="memReset">Shuffle again</button>
    </div>
  </div>

  <div class="panel" id="catch">
    <div class="card">
      <h2>Catch the falling hearts</h2>
      <div class="catchWrap" id="catchWrap">
        <div class="basket" id="basket">🧺</div>
      </div>
      <div class="scoreRow"><span id="scoreText">Score: 0</span><span id="timeText">Time: 20s</span></div>
      <button class="btn" id="catchStart">Start (30s of hearts)</button>
    </div>
  </div>

  <footer>made with a lot of love ♥</footer>

<script>
// ---- visit counter ----
(function(){
  let n = 0;
  try {
    n = parseInt(localStorage.getItem('visitCount') || '0', 10) + 1;
    localStorage.setItem('visitCount', n);
  } catch(e) { n = 1; }
  const msgs = [
    "First time here — welcome ♥",
    "Twice already, I like that.",
    "Back again? My heart's happy."
  ];
  const el = document.getElementById('counterText');
  el.textContent = n <= 3 ? (msgs[n-1] || `Visit #${n} — I made it just for you`) : `Visit #${n} — I made it just for you`;
})();

// ---- nav ----
document.querySelectorAll('nav button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.panel).classList.add('active');
  });
});

// ---- memory game ----
const symbols = ['♥','💐','💌','🌹','✨','💍','🥂','🎻'];
let memState = { first:null, second:null, lock:false, matched:0 };
function buildMemory(){
  const grid = document.getElementById('memGrid');
  grid.innerHTML = '';
  memState = { first:null, second:null, lock:false, matched:0 };
  document.getElementById('memStatus').textContent = 'Find all the pairs.';
  const deck = [...symbols, ...symbols].sort(()=>Math.random()-0.5);
  deck.forEach((sym)=>{
    const t = document.createElement('div');
    t.className = 'tile';
    t.dataset.sym = sym;
    t.textContent = '';
    t.addEventListener('click', ()=>flip(t));
    grid.appendChild(t);
  });
}
function flip(tile){
  if(memState.lock || tile.classList.contains('flip') || tile.classList.contains('matched')) return;
  tile.classList.add('flip');
  tile.textContent = tile.dataset.sym;
  if(!memState.first){ memState.first = tile; return; }
  memState.second = tile;
  memState.lock = true;
  if(memState.first.dataset.sym === memState.second.dataset.sym){
    memState.first.classList.add('matched');
    memState.second.classList.add('matched');
    memState.matched++;
    memState.first = null; memState.second = null; memState.lock = false;
    if(memState.matched === symbols.length){
      document.getElementById('memStatus').textContent = 'You found them all — just like us. ♥';
    }
  } else {
    setTimeout(()=>{
      memState.first.classList.remove('flip'); memState.first.textContent = '';
      memState.second.classList.remove('flip'); memState.second.textContent = '';
      memState.first = null; memState.second = null; memState.lock = false;
    }, 700);
  }
}
document.getElementById('memReset').addEventListener('click', buildMemory);
buildMemory();

// ---- catch game ----
const wrap = document.getElementById('catchWrap');
const basket = document.getElementById('basket');
let basketX = 0.5, score = 0, timeLeft = 30, running = false, spawnTimer, tickTimer, fallers = [];

function positionBasket(){
  const w = wrap.clientWidth;
  basket.style.left = Math.max(0, Math.min(w-64, basketX*w - 32)) + 'px';
}
function moveBasketTo(clientX){
  const rect = wrap.getBoundingClientRect();
  basketX = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  positionBasket();
}
wrap.addEventListener('mousemove', e => moveBasketTo(e.clientX));
wrap.addEventListener('touchmove', e => { moveBasketTo(e.touches[0].clientX); e.preventDefault(); }, {passive:false});
positionBasket();

function spawnHeart(){
  const h = document.createElement('div');
  h.className = 'heart';
  h.textContent = Math.random() < 0.15 ? '💔' : '❤️';
  const w = wrap.clientWidth;
  const x = Math.random() * (w-24);
  h.style.left = x + 'px';
  h.style.top = '-30px';
  wrap.appendChild(h);
  fallers.push({el:h, y:-30, bad: h.textContent === '💔'});
}
function gameLoop(){
  const wrapH = wrap.clientHeight, wrapW = wrap.clientWidth;
  const basketLeft = basketX*wrapW - 32, basketRight = basketLeft + 64;
  fallers.forEach(f=>{
    f.y += 3.2;
    f.el.style.top = f.y + 'px';
  });
  fallers = fallers.filter(f=>{
    const caught = f.y > wrapH-46 && f.y < wrapH-6;
    const fx = parseFloat(f.el.style.left);
    if(caught && fx > basketLeft-10 && fx < basketRight-10){
      score += f.bad ? -1 : 1;
      document.getElementById('scoreText').textContent = 'Score: ' + score;
      f.el.remove();
      return false;
    }
    if(f.y > wrapH){ f.el.remove(); return false; }
    return true;
  });
  if(running) requestAnimationFrame(gameLoop);
}
document.getElementById('catchStart').addEventListener('click', ()=>{
  if(running) return;
  score = 0; timeLeft = 30;
  document.getElementById('scoreText').textContent = 'Score: 0';
  document.getElementById('timeText').textContent = 'Time: 30s';
  fallers.forEach(f=>f.el.remove()); fallers = [];
  running = true;
  requestAnimationFrame(gameLoop);
  spawnTimer = setInterval(spawnHeart, 550);
  tickTimer = setInterval(()=>{
    timeLeft--;
    document.getElementById('timeText').textContent = 'Time: ' + timeLeft + 's';
    if(timeLeft <= 0){
      clearInterval(spawnTimer); clearInterval(tickTimer);
      running = false;
      fallers.forEach(f=>f.el.remove()); fallers = [];
      document.getElementById('timeText').textContent = 'Game over — final score ' + score;
    }
  }, 1000);
});
</script>
</body>
</html>
